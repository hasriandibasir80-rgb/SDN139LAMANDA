<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Beranda - SALAM D MATASKA</title>
  
  <!-- ✅ CSS MODULAR -->
  <link rel="stylesheet" href="css/core/variables.css">
  <link rel="stylesheet" href="css/core/reset.css">
  <link rel="stylesheet" href="css/layouts/main-layout.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div class="container">
    
    <!-- ✅ HEADER LOGO -->
    <div class="header-logo">
      <img src="logo-aplikasi.png" alt="Logo Aplikasi SALAM D MATASKA" class="main-logo" 
           onerror="this.style.display='none'; document.getElementById('fallback-title').style.display='block';">
      
      <h1 id="fallback-title" style="display:none; text-align:center; margin-bottom:24px; color:#2c3e50; font-size:1.8rem;">
         Beranda SALAM D MATASKA
      </h1>
    </div>

    <!-- ✅ TOMBOL LOGOUT -->
    <button id="logoutBtn" class="btn-logout">🚪 Keluar (Logout)</button>

    <hr class="divider" />

    <!-- Dropdown & Aksi -->
    <label for="layananSelect">Pilih Layanan</label>
    <select id="layananSelect">
      <option value="">-- Pilih Layanan --</option>
      <option value="layanan-portal">Layanan Portal</option>
      <option value="dokumen-arsip">Dokumen Arsip</option>
      <option value="data-statistik">Data Statistik</option>
      <option value="admin-pembelajaran">Administrasi Pembelajaran</option>
      <option value="kolaborasi-global">Kolaborasi</option>
      <option value="global-monitoring">Global-Monitoring</option>
    </select>

    <div class="action-buttons">
      <button id="saveLayananBtn">Simpan Layanan</button>
      <button id="resetBtn">Reset</button>
    </div>

    <div id="status"></div>

    <hr class="divider" />

    <!-- Area Konten Dinamis -->
    <div id="contentArea" class="content-area"></div>

  </div>

  <!-- ✅ FIREBASE & AUTH -->
  <script type="module" src="./js/firebase-config.js"></script>
  <script type="module" src="./js/auth-login.js"></script>

  <!-- ✅ MODULAR DASHBOARD CONTROLLER -->
  <script type="module">
    import { DashboardController } from './js/controllers/dashboard-controller.js';
    
    document.addEventListener('DOMContentLoaded', () => {
      new DashboardController().init();
    });
  </script>

  <!-- ✅ PROFIL USER MODULE (Modular & Berdiri Sendiri) -->
  <script type="module">
    import { init as initProfil, hideOnServiceActive, showOnNoService } 
      from './modules/profil-user/profil-user.js';
    
    document.addEventListener('DOMContentLoaded', () => {
      // Init modul profil
      initProfil();
      
      // Handle perubahan layanan
      const layananSelect = document.getElementById('layananSelect');
      
      layananSelect.addEventListener('change', function() {
        if (this.value) {
          // Layanan dipilih → sembunyikan profil
          hideOnServiceActive();
        } else {
          // Tidak ada layanan → tampilkan profil
          showOnNoService();
        }
      });
      
      // Cek layanan aktif saat load
      const layananAktif = localStorage.getItem('layananAktif');
      if (layananAktif) {
        layananSelect.value = layananAktif;
        hideOnServiceActive();
      }
      
      // Handle tombol Reset
      const resetBtn = document.getElementById('resetBtn');
      if (resetBtn) {
        resetBtn.addEventListener('click', () => {
          setTimeout(() => {
            showOnNoService();
          }, 500);
        });
      }
    });
  </script>

  <!-- ✅ AUTH CHECK & LOGOUT HANDLER -->
  <script>
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      if (!confirm('Yakin ingin keluar?')) return;
      try {
        localStorage.removeItem('currentUser');
        localStorage.removeItem('layananAktif');
        window.location.href = './index.html';
      } catch (err) {
        console.error('Logout error:', err);
        alert('Gagal logout: ' + err.message);
      }
    });
  </script>
</body>
</html>
