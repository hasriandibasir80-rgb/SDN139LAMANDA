<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Beranda - SDN 139 LAMANDA</title>
  
  <!-- ✅ CSS MODULAR -->
  <link rel="stylesheet" href="css/core/variables.css">
  <link rel="stylesheet" href="css/core/reset.css">
  <link rel="stylesheet" href="css/layouts/main-layout.css">
  <link rel="stylesheet" href="css/dashboard.css">
  
  <!-- ✅ CSS Profil User -->
  <link rel="stylesheet" href="css/modules/profil-user.css">
</head>
<body>
  <div class="container">
    
    <!-- ✅ HEADER LOGO -->
    <div class="header-logo">
      <img src="logo-aplikasi.png" alt="Logo Aplikasi SDN 139 LAMANDA" class="main-logo" 
           onerror="this.style.display='none'; document.getElementById('fallback-title').style.display='block';">
      
      <h1 id="fallback-title" style="display:none; text-align:center; margin-bottom:24px; color:#2c3e50; font-size:1.8rem;">
         Beranda SDN 139 LAMANDA
      </h1>
    </div>

    <!-- User Info & Logout -->
    <div class="user-info" id="userInfo">
      <strong>👤 User:</strong>
      <div id="userDetail">Memuat...</div>
    </div>
    
    <!-- ✅ TOMBOL PROFIL USER (BARU - Langsung di HTML) -->
    <div id="profilButtonsContainer" style="display: flex; gap: 10px; margin: 15px 0; flex-wrap: wrap;">
      <button id="btnEditProfil" class="profil-btn" onclick="openEditProfileModal()">✏️ Edit Profil</button>
      <button id="btnUbahPassword" class="profil-btn password" onclick="openChangePasswordModal()">🔑 Ubah Password</button>
    </div>
    
    <button id="logoutBtn" class="btn-logout">🚪 Keluar (Logout)</button>

    <hr class="divider" />

    <!-- Dropdown & Aksi -->
    <label for="layananSelect">Pilih Layanan</label>
    <select id="layananSelect">
      <option value="">-- Pilih Layanan --</option>
      <option value="layanan-portal">Layanan Portal</option>
      <option value="dokumen-arsip">Dokumen Arsip</option>
      <option value="data-statistik">Data Statistik</option>
      <option value="admin-pembelajaran">Administrasi Pembelajaran</option>
      <option value="kolaborasi-global">Kolaborasi</option>
      <option value="global-monitoring">Global-Monitoring</option>
    </select>

    <div class="action-buttons">
      <button id="saveLayananBtn">Simpan Layanan</button>
      <button id="resetBtn">Reset</button>
    </div>

    <div id="status"></div>

    <hr class="divider" />

    <!-- Area Konten Dinamis -->
    <div id="contentArea" class="content-area"></div>

  </div>

  <!-- ✅ FIREBASE & AUTH -->
  <script type="module" src="./js/firebase-config.js"></script>
  <script type="module" src="./js/auth-login.js"></script>

  <!-- ✅ MODULAR DASHBOARD CONTROLLER -->
  <script type="module">
    import { DashboardController } from './js/controllers/dashboard-controller.js';
    
    document.addEventListener('DOMContentLoaded', () => {
      new DashboardController().init();
    });
  </script>

  <!-- ✅ PROFIL USER FUNCTIONS (Inline - Pasti Bekerja) -->
  <script type="module">
    import { getAuth, updateProfile, updatePassword, EmailAuthProvider, reauthenticateWithCredential } 
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getDatabase, ref, get, set } 
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const auth = getAuth();
    const database = getDatabase();

    // Load CSS
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'css/modules/profil-user.css';
    link.id = 'profil-user-css';
    document.head.appendChild(link);

    // Fungsi Edit Profil
    window.openEditProfileModal = function() {
      const user = auth.currentUser;
      if (!user) {
        alert(' User tidak login!');
        return;
      }
      
      const modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.id = 'profilModal';
      
      modal.innerHTML = `
        <div class="modal-content">
          <div class="modal-header"> Edit Profil User</div>
          <div class="modal-body">
            <div class="alert alert-info">💡 Update informasi profil Anda di bawah ini.</div>
            <div class="form-group">
              <label>📧 Email (Tidak dapat diubah)</label>
              <input type="email" id="profilEmail" class="form-control" value="${user.email}" disabled>
            </div>
            <div class="form-group">
              <label>👤 Nama Lengkap</label>
              <input type="text" id="profilNama" class="form-control" placeholder="Masukkan nama lengkap" value="${user.displayName || ''}">
            </div>
            <div class="form-group">
              <label>📱 Nomor HP / WhatsApp</label>
              <input type="tel" id="profilHp" class="form-control" placeholder="08xx-xxxx-xxxx">
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn-modal btn-modal-cancel" onclick="closeModal()">Batal</button>
            <button class="btn-modal btn-modal-save" onclick="saveProfile()">💾 Simpan Perubahan</button>
          </div>
        </div>
      `;
      
      document.body.appendChild(modal);
      
      // Load data dari database
      loadUserData(user.uid);
    }

    // Fungsi Ubah Password
    window.openChangePasswordModal = function() {
      const user = auth.currentUser;
      if (!user) {
        alert('❌ User tidak login!');
        return;
      }
      
      const modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.id = 'profilModal';
      
      modal.innerHTML = `
        <div class="modal-content">
          <div class="modal-header">🔑 Ubah Password</div>
          <div class="modal-body">
            <div class="alert alert-info">🔒 Untuk keamanan, masukkan password lama Anda sebelum mengubah password.</div>
            <div class="form-group">
              <label>🔑 Password Lama</label>
              <input type="password" id="oldPassword" class="form-control" placeholder="Masukkan password lama">
            </div>
            <div class="form-group">
              <label>🔑 Password Baru</label>
              <input type="password" id="newPassword" class="form-control" placeholder="Masukkan password baru (min. 6 karakter)">
            </div>
            <div class="form-group">
              <label>🔑 Konfirmasi Password Baru</label>
              <input type="password" id="confirmPassword" class="form-control" placeholder="Ulangi password baru">
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn-modal btn-modal-cancel" onclick="closeModal()">Batal</button>
            <button class="btn-modal btn-modal-save" onclick="changePassword()">🔑 Ubah Password</button>
          </div>
        </div>
      `;
      
      document.body.appendChild(modal);
    }

    // Tutup Modal
    window.closeModal = function() {
      const modal = document.getElementById('profilModal');
      if (modal) modal.remove();
    }

    // Load Data User
    async function loadUserData(uid) {
      try {
        const snapshot = await get(ref(database, `users/${uid}`));
        if (snapshot.exists()) {
          const data = snapshot.val();
          if (data.noHP) {
            const hpInput = document.getElementById('profilHp');
            if (hpInput) hpInput.value = data.noHP;
          }
        }
      } catch (error) {
        console.error('❌ Gagal load data user:', error);
      }
    }

    // Simpan Profil
    window.saveProfile = async function() {
      const user = auth.currentUser;
      if (!user) {
        alert('❌ User tidak login!');
        return;
      }
      
      const nama = document.getElementById('profilNama').value.trim();
      const noHP = document.getElementById('profilHp').value.trim();
      
      if (!nama) {
        alert('⚠️ Nama lengkap harus diisi!');
        return;
      }
      
      try {
        await updateProfile(user, { displayName: nama });
        
        await set(ref(database, `users/${user.uid}`), {
          uid: user.uid,
          email: user.email,
          displayName: nama,
          noHP: noHP,
          updatedAt: Date.now()
        });
        
        alert('✅ Profil berhasil diupdate!');
        closeModal();
        setTimeout(() => location.reload(), 1500);
        
      } catch (error) {
        console.error('❌ Gagal update profil:', error);
        alert('❌ Gagal update profil: ' + error.message);
      }
    }

    // Ubah Password
    window.changePassword = async function() {
      const user = auth.currentUser;
      if (!user) {
        alert('❌ User tidak login!');
        return;
      }
      
      if (!user.email) {
        alert('❌ Email user tidak ditemukan!');
        return;
      }
      
      const oldPassword = document.getElementById('oldPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      if (!oldPassword || !newPassword || !confirmPassword) {
        alert('⚠️ Semua field harus diisi!');
        return;
      }
      
      if (newPassword.length < 6) {
        alert('⚠️ Password baru minimal 6 karakter!');
        return;
      }
      
      if (newPassword !== confirmPassword) {
        alert(' Password baru tidak cocok!');
        return;
      }
      
      try {
        const credential = EmailAuthProvider.credential(user.email, oldPassword);
        await reauthenticateWithCredential(user, credential);
        await updatePassword(user, newPassword);
        
        alert('✅ Password berhasil diubah! Silakan login ulang.');
        closeModal();
        
        setTimeout(async () => {
          await auth.signOut();
          window.location.href = 'index.html';
        }, 2000);
        
      } catch (error) {
        console.error('❌ Gagal ubah password:', error);
        
        if (error.code === 'auth/wrong-password') {
          alert('❌ Password lama salah!');
        } else if (error.code === 'auth/weak-password') {
          alert('️ Password terlalu lemah!');
        } else {
          alert('❌ Gagal ubah password: ' + error.message);
        }
      }
    }

    console.log('✅ Modul Profil User berhasil di-load');
  </script>

  <!-- ✅ AUTH CHECK & LOGOUT HANDLER -->
  <script>
    function checkLoginState() {
      const currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
      if (!currentUser || !currentUser.uid) {
        window.location.href = './index.html';
        return false;
      }
      const userDetail = document.getElementById('userDetail');
      let info = `<div>🆔 UID: <strong>${currentUser.uid}</strong></div>`;
      if (currentUser.displayName) info += `<div>👤 Nama: <strong>${currentUser.displayName}</strong></div>`;
      if (currentUser.email) info += `<div>📧 Email: <strong>${currentUser.email}</strong></div>`;
      if (currentUser.isDemo) info += `<div>🎭 Mode: <strong>Demo</strong></div>`;
      if (currentUser.isCustomId) info += `<div> Mode: <strong>Custom ID</strong></div>`;
      userDetail.innerHTML = info;
      return true;
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      if (!confirm('Yakin ingin keluar?')) return;
      try {
        localStorage.removeItem('currentUser');
        localStorage.removeItem('layananAktif');
        window.location.href = './index.html';
      } catch (err) {
        console.error('Logout error:', err);
        alert('Gagal logout: ' + err.message);
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      checkLoginState();
    });
  </script>
</body>
</html>
