<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Beranda - SDN 139 LAMANDA</title>
  
  <!-- ✅ CSS MODULAR -->
  <link rel="stylesheet" href="css/core/variables.css">
  <link rel="stylesheet" href="css/core/reset.css">
  <link rel="stylesheet" href="css/layouts/main-layout.css">
  <link rel="stylesheet" href="css/dashboard.css">
  
  <!-- ✅ INLINE CSS PROFIL (tidak perlu file eksternal) -->
  <style id="profil-user-css">
    /* Tombol Profil */
    .profil-btn {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
    }
    .profil-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(59, 130, 246, 0.4); }
    .profil-btn.password { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); box-shadow: 0 2px 8px rgba(245, 158, 11, 0.3); }
    .profil-btn.password:hover { box-shadow: 0 4px 16px rgba(245, 158, 11, 0.4); }
    
    /* Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); z-index: 10000;
      display: flex; justify-content: center; align-items: center;
      backdrop-filter: blur(4px);
    }
    .modal-content {
      background: white; border-radius: 16px; padding: 30px;
      max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: modalSlideIn 0.3s ease;
    }
    @keyframes modalSlideIn {
      from { transform: translateY(-50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal-header {
      font-size: 22px; font-weight: 700; color: #1e293b;
      margin-bottom: 20px; border-bottom: 3px solid #fce7f3;
      padding-bottom: 12px;
    }
    .modal-body { margin-bottom: 25px; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: #475569; }
    .form-control {
      width: 100%; padding: 12px 16px; border: 2px solid #e2e8f0;
      border-radius: 8px; font-size: 15px; box-sizing: border-box;
      transition: all 0.2s;
    }
    .form-control:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
    .form-control:disabled { background: #f1f5f9; cursor: not-allowed; }
    .modal-footer { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
    .btn-modal {
      padding: 12px 24px; border: none; border-radius: 8px;
      font-weight: 600; font-size: 15px; cursor: pointer; transition: all 0.2s;
    }
    .btn-modal-save { background: #10b981; color: white; }
    .btn-modal-save:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4); }
    .btn-modal-cancel { background: #64748b; color: white; }
    .btn-modal-cancel:hover { background: #475569; }
    .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; }
    .alert-info { background: #dbeafe; color: #1e40af; border-left: 4px solid #3b82f6; }
    
    /* Toast */
    .toast-notification {
      position: fixed; top: 20px; right: 20px;
      padding: 14px 24px; border-radius: 10px;
      color: white; font-weight: 600; font-size: 14px;
      z-index: 10001; box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      animation: slideIn 0.3s ease;
    }
    .toast-notification.success { background: #10b981; }
    .toast-notification.error { background: #ef4444; }
    @keyframes slideIn {
      from { transform: translateX(400px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    
    /* Container Profil Khusus */
    .profil-container {
      background: white;
      border-radius: 16px;
      padding: 30px;
      margin: 20px 0;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }
    .profil-container h2 {
      color: #1e293b;
      margin-bottom: 20px;
      border-bottom: 3px solid #fce7f3;
      padding-bottom: 12px;
    }
    .profil-section {
      background: #f8fafc;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      border-left: 4px solid #3b82f6;
    }
    .profil-section h3 {
      margin: 0 0 15px 0;
      color: #475569;
      font-size: 16px;
    }
    .profil-section.password-section {
      border-left-color: #f59e0b;
    }
    @media (max-width: 600px) {
      .modal-content { padding: 20px; }
      .modal-footer { flex-direction: column; }
      .btn-modal { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- ✅ HEADER LOGO -->
    <div class="header-logo">
      <img src="logo-aplikasi.png" alt="Logo Aplikasi SDN 139 LAMANDA" class="main-logo" 
           onerror="this.style.display='none'; document.getElementById('fallback-title').style.display='block';">
      
      <h1 id="fallback-title" style="display:none; text-align:center; margin-bottom:24px; color:#2c3e50; font-size:1.8rem;">
         Beranda SDN 139 LAMANDA
      </h1>
    </div>

    <!-- User Info -->
    <div class="user-info" id="userInfo">
      <strong>👤 User:</strong>
      <div id="userDetail">Memuat...</div>
    </div>
    
    <!-- ✅ TOMBOL PROFIL (Hanya tampil saat TIDAK ada layanan aktif) -->
    <div id="profilButtonsContainer" style="display: flex; gap: 10px; margin: 15px 0; flex-wrap: wrap;">
      <button class="profil-btn" onclick="showProfilView()">👤 Lihat Profil Saya</button>
      <button class="profil-btn password" onclick="openChangePasswordModal()">🔑 Ubah Password</button>
    </div>
    
    <!-- ✅ AREA TAMPILAN PROFIL (Khusus, seperti layanan) -->
    <div id="profilViewContainer" style="display: none;">
      <div class="profil-container">
        <h2>👤 Profil User</h2>
        
        <div class="profil-section">
          <h3>📋 Informasi Akun</h3>
          <div class="form-group">
            <label>🆔 UID</label>
            <input type="text" id="profilUid" class="form-control" disabled>
          </div>
          <div class="form-group">
            <label>📧 Email</label>
            <input type="email" id="profilEmailView" class="form-control" disabled>
          </div>
          <div class="form-group">
            <label>👤 Nama Lengkap</label>
            <input type="text" id="profilNamaView" class="form-control">
          </div>
          <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button class="btn-modal btn-modal-save" onclick="saveProfileInline()">💾 Simpan Perubahan</button>
            <button class="btn-modal btn-modal-cancel" onclick="hideProfilView()">✖️ Tutup</button>
          </div>
        </div>
        
        <div class="profil-section password-section">
          <h3>🔑 Ubah Password</h3>
          <div class="alert alert-info"> Untuk keamanan, masukkan password lama Anda sebelum mengubah password.</div>
          <div class="form-group">
            <label>🔑 Password Lama</label>
            <input type="password" id="oldPassword" class="form-control" placeholder="Masukkan password lama">
          </div>
          <div class="form-group">
            <label>🔑 Password Baru</label>
            <input type="password" id="newPassword" class="form-control" placeholder="Min. 6 karakter">
          </div>
          <div class="form-group">
            <label>🔑 Konfirmasi Password Baru</label>
            <input type="password" id="confirmPassword" class="form-control" placeholder="Ulangi password baru">
          </div>
          <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button class="btn-modal btn-modal-save" onclick="changePasswordInline()">🔑 Ubah Password</button>
          </div>
        </div>
      </div>
    </div>
    
    <button id="logoutBtn" class="btn-logout">🚪 Keluar (Logout)</button>

    <hr class="divider" />

    <!-- Dropdown & Aksi -->
    <label for="layananSelect">Pilih Layanan</label>
    <select id="layananSelect">
      <option value="">-- Pilih Layanan --</option>
      <option value="layanan-portal">Layanan Portal</option>
      <option value="dokumen-arsip">Dokumen Arsip</option>
      <option value="data-statistik">Data Statistik</option>
      <option value="admin-pembelajaran">Administrasi Pembelajaran</option>
      <option value="kolaborasi-global">Kolaborasi</option>
      <option value="global-monitoring">Global-Monitoring</option>
    </select>

    <div class="action-buttons">
      <button id="saveLayananBtn">Simpan Layanan</button>
      <button id="resetBtn">Reset</button>
    </div>

    <div id="status"></div>

    <hr class="divider" />

    <!-- Area Konten Dinamis -->
    <div id="contentArea" class="content-area"></div>

  </div>

  <!-- ✅ FIREBASE & AUTH -->
  <script type="module" src="./js/firebase-config.js"></script>
  <script type="module" src="./js/auth-login.js"></script>

  <!-- ✅ MODULAR DASHBOARD CONTROLLER -->
  <script type="module">
    import { DashboardController } from './js/controllers/dashboard-controller.js';
    
    document.addEventListener('DOMContentLoaded', () => {
      new DashboardController().init();
    });
  </script>

  <!-- ✅ PROFIL USER FUNCTIONS (Inline - Fix Error) -->
  <script type="module">
    import { getAuth, updateProfile, updatePassword, EmailAuthProvider, reauthenticateWithCredential } 
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const auth = getAuth();

    //  Tunggu auth siap, lalu isi data profil
    auth.onAuthStateChanged((user) => {
      if (user) {
        // Isi data ke form profil inline
        const uidEl = document.getElementById('profilUid');
        const emailEl = document.getElementById('profilEmailView');
        const namaEl = document.getElementById('profilNamaView');
        
        if (uidEl) uidEl.value = user.uid;
        if (emailEl) emailEl.value = user.email;
        if (namaEl) namaEl.value = user.displayName || '';
        
        console.log('✅ Data profil berhasil dimuat dari Firebase Auth');
      }
    });

    //  Tampilkan tampilan profil khusus (seperti layanan)
    window.showProfilView = function() {
      // Sembunyikan tombol profil
      document.getElementById('profilButtonsContainer').style.display = 'none';
      // Tampilkan container profil
      document.getElementById('profilViewContainer').style.display = 'block';
      // Scroll ke atas
      window.scrollTo({ top: 0, behavior: 'smooth' });
      console.log('✅ Tampilan profil khusus dibuka');
    };

    //  Sembunyikan tampilan profil
    window.hideProfilView = function() {
      document.getElementById('profilViewContainer').style.display = 'none';
      document.getElementById('profilButtonsContainer').style.display = 'flex';
      console.log('✅ Tampilan profil ditutup');
    };

    // ⭐ Simpan profil (inline, tanpa Firebase RTDB - hanya Auth)
    window.saveProfileInline = async function() {
      const user = auth.currentUser;
      if (!user) {
        showToast('❌ User tidak login!', 'error');
        return;
      }
      
      const nama = document.getElementById('profilNamaView').value.trim();
      
      if (!nama) {
        showToast('⚠️ Nama lengkap harus diisi!', 'error');
        return;
      }
      
      try {
        await updateProfile(user, { displayName: nama });
        
        // Update localStorage juga
        const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
        currentUser.displayName = nama;
        localStorage.setItem('currentUser', JSON.stringify(currentUser));
        
        showToast('✅ Profil berhasil diupdate!', 'success');
        
        // Refresh tampilan user info
        setTimeout(() => location.reload(), 1500);
        
      } catch (error) {
        console.error('❌ Gagal update profil:', error);
        showToast('❌ Gagal update profil: ' + error.message, 'error');
      }
    };

    // ⭐ Ubah password (inline)
    window.changePasswordInline = async function() {
      const user = auth.currentUser;
      if (!user) {
        showToast('❌ User tidak login!', 'error');
        return;
      }
      
      if (!user.email) {
        showToast('❌ Email user tidak ditemukan!', 'error');
        return;
      }
      
      const oldPassword = document.getElementById('oldPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      if (!oldPassword || !newPassword || !confirmPassword) {
        showToast('⚠️ Semua field harus diisi!', 'error');
        return;
      }
      
      if (newPassword.length < 6) {
        showToast('⚠️ Password baru minimal 6 karakter!', 'error');
        return;
      }
      
      if (newPassword !== confirmPassword) {
        showToast('❌ Password baru tidak cocok!', 'error');
        return;
      }
      
      try {
        const credential = EmailAuthProvider.credential(user.email, oldPassword);
        await reauthenticateWithCredential(user, credential);
        await updatePassword(user, newPassword);
        
        showToast('✅ Password berhasil diubah! Silakan login ulang.', 'success');
        
        // Clear form
        document.getElementById('oldPassword').value = '';
        document.getElementById('newPassword').value = '';
        document.getElementById('confirmPassword').value = '';
        
        setTimeout(async () => {
          await auth.signOut();
          window.location.href = 'index.html';
        }, 2000);
        
      } catch (error) {
        console.error('❌ Gagal ubah password:', error);
        
        if (error.code === 'auth/wrong-password') {
          showToast('❌ Password lama salah!', 'error');
        } else if (error.code === 'auth/weak-password') {
          showToast('⚠️ Password terlalu lemah!', 'error');
        } else {
          showToast('❌ Gagal ubah password: ' + error.message, 'error');
        }
      }
    };

    // ⭐ Toast notification
    function showToast(message, type = 'success') {
      const existing = document.querySelector('.toast-notification');
      if (existing) existing.remove();
      
      const toast = document.createElement('div');
      toast.className = `toast-notification ${type}`;
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    console.log('✅ Modul Profil User berhasil di-load (versi inline)');
  </script>

  <!-- ✅ AUTH CHECK & LOGOUT HANDLER -->
  <script>
    function checkLoginState() {
      const currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
      if (!currentUser || !currentUser.uid) {
        window.location.href = './index.html';
        return false;
      }
      const userDetail = document.getElementById('userDetail');
      let info = `<div>🆔 UID: <strong>${currentUser.uid}</strong></div>`;
      if (currentUser.displayName) info += `<div>👤 Nama: <strong>${currentUser.displayName}</strong></div>`;
      if (currentUser.email) info += `<div> Email: <strong>${currentUser.email}</strong></div>`;
      if (currentUser.isDemo) info += `<div>🎭 Mode: <strong>Demo</strong></div>`;
      if (currentUser.isCustomId) info += `<div>🔑 Mode: <strong>Custom ID</strong></div>`;
      userDetail.innerHTML = info;
      return true;
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      if (!confirm('Yakin ingin keluar?')) return;
      try {
        localStorage.removeItem('currentUser');
        localStorage.removeItem('layananAktif');
        window.location.href = './index.html';
      } catch (err) {
        console.error('Logout error:', err);
        alert('Gagal logout: ' + err.message);
      }
    });

    // ⭐ LOGIKA BARU: Sembunyikan profil saat layanan aktif
    const layananSelect = document.getElementById('layananSelect');
    const profilButtons = document.getElementById('profilButtonsContainer');
    const profilView = document.getElementById('profilViewContainer');
    
    layananSelect.addEventListener('change', function() {
      if (this.value) {
        // Layanan dipilih → sembunyikan profil
        if (profilButtons) profilButtons.style.display = 'none';
        if (profilView) profilView.style.display = 'none';
        console.log('🔒 Profil disembunyikan karena layanan aktif:', this.value);
      } else {
        // Tidak ada layanan → tampilkan tombol profil
        if (profilButtons) profilButtons.style.display = 'flex';
        console.log('🔓 Profil ditampilkan karena tidak ada layanan aktif');
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      checkLoginState();
      
      // Cek jika ada layanan aktif tersimpan
      const layananAktif = localStorage.getItem('layananAktif');
      if (layananAktif) {
        layananSelect.value = layananAktif;
        if (profilButtons) profilButtons.style.display = 'none';
        if (profilView) profilView.style.display = 'none';
      }
    });
  </script>
</body>
</html>
